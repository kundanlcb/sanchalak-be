plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.2'
	id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.cm.sanchalak'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
	maven { url 'https://repo.spring.io/milestone' }
	maven { url 'https://repo.spring.io/snapshot' }
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'com.fasterxml.jackson.core:jackson-databind'
	implementation 'org.apache.commons:commons-csv:1.10.0'
	
	// Database Migration
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-mysql'
	
	compileOnly 'org.projectlombok:lombok:1.18.42'
	annotationProcessor 'org.projectlombok:lombok:1.18.42'
	
	runtimeOnly 'com.mysql:mysql-connector-j'
	
	implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.5'

    // Finance Module - Receipt Generation
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'com.openhtmltopdf:openhtmltopdf-pdfbox:1.0.10'
	
	// Mobile API - Push Notifications (Firebase Cloud Messaging)
	implementation 'com.google.firebase:firebase-admin:9.2.0'
	
	// Mobile API - File Storage (AWS S3)
	implementation platform('software.amazon.awssdk:bom:2.20.26')
	implementation 'software.amazon.awssdk:s3'
	
	// Mobile API - File Storage (Azure Blob Storage - alternative to S3)
	implementation 'com.azure:azure-storage-blob:12.25.0'
	
	// Mobile API - Caching (Caffeine)
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'
	
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.3'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webflux'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'com.intuit.karate:karate-junit5:1.4.1'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testRuntimeOnly 'com.h2database:h2'
}

tasks.named('test') {
	useJUnitPlatform()
}

sourceSets {
	test {
		java {
			exclude '**/*IntegrationTest.java'
			exclude '**/integration/**'
			exclude '**/MobileAuthControllerTest.java'
			exclude '**/karate/**'
		}
	}
}

tasks.register('karateSmoke', Test) {
	useJUnitPlatform()
	include '**/KarateSmokeRunner.class'
	systemProperty 'karate.env', System.getProperty('karate.env', 'local')
	systemProperty 'karate.baseUrl', System.getProperty('karate.baseUrl', 'http://localhost:8082')
}

tasks.register('karateRegression', Test) {
	useJUnitPlatform()
	include '**/KarateRegressionRunner.class'
	systemProperty 'karate.env', System.getProperty('karate.env', 'local')
	systemProperty 'karate.baseUrl', System.getProperty('karate.baseUrl', 'http://localhost:8082')
}

tasks.register('karateJourney', Test) {
	useJUnitPlatform()
	include '**/KarateJourneyRunner.class'
	systemProperty 'karate.env', System.getProperty('karate.env', 'local')
	systemProperty 'karate.baseUrl', System.getProperty('karate.baseUrl', 'http://localhost:8082')
}
