spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: ''
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

app:
  jwtSecret: 9a02115a835ee03d5fb83cd8a468ea33e4090a6a27e4e1a47321696435f3b7f1
  jwtExpirationInMs: 604800000
  jwt:
    access-token-expiry-ms: 900000
    refresh-token-expiry-days: 30
  otp:
    expiry-minutes: 5
    encryption-key: "1234567812345678"
    rate-limit:
      max-requests: 3
      window-minutes: 15
  firebase:
    enabled: false
  storage:
    provider: s3

